# INTENTIONALLY INSECURE — LAB USE ONLY
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-reader-secret-access
  namespace: security-lab
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-reader-secret-access-binding
  namespace: security-lab
subjects:
  - kind: ServiceAccount
    name: app-reader
    namespace: security-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: app-reader-secret-access
